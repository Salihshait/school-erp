name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install root dependencies
        run: npm install

      - name: Install client dependencies
        run: npm --prefix school-erp.client install

      - name: Install server dependencies
        run: npm --prefix server install

      - name: Build client
        run: npm --prefix school-erp.client run build

      - name: Lint client
        run: npm --prefix school-erp.client run lint

      - name: Validate server
        run: npm --prefix server run start -- --help
